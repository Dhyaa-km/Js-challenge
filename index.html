<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="./src/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>js-challenge</title>
  </head>
  <body>
      <div class="gif-header">
        <img src="./public/Game_of_life_animated_glider.gif" id="img1" alt="Game of life" width="100" height="100">
        <h1>Conway's Game of Life</h1>
        <p></p>
      </div>
        <div class="controls">
            <button id="startBtn">Start/Stop</button>
            <button id="clearBtn">Clear</button>
            <button id="randomBtn">Random</button>
            <button id="gliderGunBtn">Glider Gun</button>
            <button id="pulsarBtn">Pulsar</button>
            <button id="pentaDecathlonBtn">PentaDecathlon</button>
        </div>
        <div class="canvas-container">
          <canvas id="gridCanvas"></canvas>
          <div class="speed-controls">
            <button id="increaseSpeedBtn">Speed +</button>
            <button id="decreaseSpeedBtn">Speed -</button>
          </div>
        </div>

    
    <script src="./src/main.js"></script>
  </body>
</html>
